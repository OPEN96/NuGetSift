name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------------------------------------
  # 三平台构建 + 自检
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NuGetSift.slnx

      - name: Build
        run: dotnet build NuGetSift.slnx -c Release --no-restore

      - name: Self-test (公共/私有 区分逻辑)
        run: dotnet run --project src/NuGetSift.Cli/NuGetSift.Cli.csproj -c Release --no-build -- --selftest

  # ---------------------------------------------------------------------------
  # 打 v* 标签时：发布桌面客户端 + 命令行（单文件、自包含）
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 桌面客户端：6 个架构（linux-arm 32 位缺少原生图形依赖，不发布桌面版）
      - name: Publish desktop
        shell: bash
        run: |
          set -euo pipefail
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            echo "==> desktop $rid"
            dotnet publish src/NuGetSift.Desktop/NuGetSift.Desktop.csproj \
              -c Release -r "$rid" \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:PublishTrimmed=false \
              --self-contained true \
              -o "./publish/desktop-$rid"
          done

      # 命令行：7 个架构（含 linux-arm 32 位）
      - name: Publish cli
        shell: bash
        run: |
          set -euo pipefail
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 linux-arm osx-x64 osx-arm64; do
            echo "==> cli $rid"
            dotnet publish src/NuGetSift.Cli/NuGetSift.Cli.csproj \
              -c Release -r "$rid" \
              -p:PublishSingleFile=true \
              -p:PublishTrimmed=false \
              --self-contained true \
              -o "./publish/cli-$rid"
          done

      - name: Package zip
        shell: pwsh
        run: |
          Get-ChildItem ./publish -Directory | ForEach-Object {
            $name = "NuGetSift-$env:VERSION-$($_.Name).zip"
            Write-Host "packing $name"
            Compress-Archive -Path "$($_.FullName)/*" -DestinationPath "./$name" -Force
          }
          Get-ChildItem ./*.zip | Select-Object Name, Length

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
