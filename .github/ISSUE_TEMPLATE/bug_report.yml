name: 🐛 Bug 报告
description: 报告 NuGetSift 运行异常、下载失败或判定错误
title: "[Bug] "
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整，能帮我们更快定位问题。
        ⚠️ **提交前请先脱敏**：不要粘贴真实内网地址、API Key / PAT、内部包名。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？你期望的结果是什么？
      placeholder: 例如：扫描只枚举到 100 个包，实际私有源有 300+ 个。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请给出可稳定复现的操作序列
      placeholder: |
        1. config.json 中 BaGet.BaseUrl = http://<已脱敏>/v3/index.json
        2. 运行 `NuGetSift --dry-run`
        3. 观察到 ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 输出 / 日志
      description: 粘贴 `--dry-run` 或运行时的控制台输出、report.md 相关片段（记得脱敏）
      render: shell
    validations:
      required: false

  - type: dropdown
    id: form
    attributes:
      label: 使用的形态
      options:
        - 命令行 (CLI)
        - 桌面客户端 (Desktop)
        - 两者都有
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: 私有源类型
      options:
        - BaGet / Bagetter
        - Nexus
        - Artifactory
        - Azure Artifacts
        - 其他 / 不确定
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: NuGetSift 版本
      description: 见程序输出首行（如 v2.0.0）或 Release 标签
      placeholder: v2.0.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统 + 架构 + .NET 版本（若为源码运行）
      placeholder: "Windows 11 x64 / 预编译单文件"
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: 关键配置（已脱敏）
      description: 相关的 config.json 字段，如 EnumerateMode、AuthType、VersionLevel（**不要填 ApiKey**）
      render: json
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issues，确认没有重复
          required: true
        - label: 我已删除日志与配置中的地址、令牌等敏感信息
          required: true
