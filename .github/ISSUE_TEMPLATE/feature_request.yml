name: ✨ 功能建议
description: 提出新功能、新私有源兼容或体验改进
title: "[Feature] "
labels: [ "enhancement" ]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出想法！请先简单搜一下现有 Issues，避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的场景或痛点，而不只是想要的方案
      placeholder: 我们的 Nexus 源 search 接口返回不全，希望支持 ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望 NuGetSift 怎么做？如有配置项 / 命令参数建议也请写出
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
      description: 现有的配置或参数能否绕过？为什么不够用？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 影响的形态
      options:
        - 命令行 (CLI)
        - 桌面客户端 (Desktop)
        - 共享引擎 (Core)
        - 文档 / CI
        - 不确定
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 私有源类型、规模、截图或其他背景（记得脱敏）
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issues 与 Discussion，确认没有重复
          required: true
        - label: 我愿意在方案确定后帮忙测试或提交 PR（可选）
          required: false
