version: 2
updates:
  # NuGet 依赖（Avalonia 等）
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels: [ "dependencies", "nuget" ]
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions 版本（actions/checkout、setup-dotnet 等）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels: [ "dependencies", "github-actions" ]
    commit-message:
      prefix: "chore(ci)"
